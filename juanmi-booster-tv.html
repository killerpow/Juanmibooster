<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juanmi Booster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e11;--card:#161a20;--card2:#1d222a;--line:#262c35;
  --txt:#f2f4f7;--mut:#98a0ac;--acc:#ff5b1f;--acc2:#ffb21f;--ok:#2fd27a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-size:30px;font-weight:800;line-height:1}
.brand span{color:var(--acc)}
.hello{color:var(--mut);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:18px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#ff5b1f 0%,#ff8a1f 60%,#ffb21f 100%);color:#140800;border-radius:24px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero h2{font-size:30px;font-weight:800;line-height:1}
.hero .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.75}
.hero .meta{font-weight:600;margin:6px 0 12px;font-size:14px}
.hero .chips span{background:rgba(20,8,0,.14)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;font-weight:700;font-size:16px;background:var(--acc);color:#fff;font-family:"Barlow Condensed";letter-spacing:1px;font-size:20px;text-transform:uppercase}
.btn.dark{background:#140800;color:#fff}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.sm{padding:10px 14px;font-size:16px;width:auto;border-radius:12px}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card2)}
.row{display:flex;gap:10px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:18px;padding:12px}
.stat b{display:block;font-family:"Barlow Condensed";font-size:26px;font-weight:800;line-height:1.1}
.stat small{color:var(--mut);font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec h3{font-size:22px;font-weight:700}
.sec a{color:var(--acc);font-size:13px;font-weight:600;cursor:pointer}
.mut{color:var(--mut)}
.small{font-size:13px}
.week{display:flex;justify-content:space-between;margin-bottom:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex:1}
.wd i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--txt);background:var(--card)}
.wd.today i{outline:2px solid var(--acc)}
.wd.done i{background:var(--acc);color:#fff}
.dayitem{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:16px;margin-bottom:8px;width:100%;text-align:left}
.dayitem .num{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:800;font-size:20px;flex:none}
.dayitem.done .num{background:var(--ok);color:#06210f}
.dayitem .t{flex:1;min-width:0}
.dayitem .t b{display:block;font-size:15px}
.dayitem .t small{color:var(--mut)}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .t{flex:1;min-width:0}
.exrow .t b{display:block;font-size:14px;font-weight:600}
.exrow .t small{color:var(--mut);font-size:12px}
.thumb{width:44px;height:52px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.swap{font-size:12px;font-weight:600;color:var(--acc);padding:6px 8px;border-radius:10px;background:rgba(255,91,31,.1)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(12,14,17,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(var(--sb) + 8px);display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;max-width:520px;width:100%;justify-content:space-around}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 8px;border-radius:12px;min-width:60px}

nav.tabs button.on{color:var(--acc)}

.qtop{display:flex;align-items:center;gap:12px;margin-bottom:22px}

.opt b{display:block;font-size:16px}
.opt small{color:var(--mut)}
.opt.sel{border-color:var(--acc);background:rgba(255,91,31,.08)}

.opt.sel .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optgrid .opt{margin:0;flex-direction:column;text-align:center;gap:6px;padding:18px 10px}
.optgrid .opt .ck{display:none}
.qfoot{margin-top:auto;padding-top:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.field .inp{display:flex;align-items:center;background:var(--card);border-radius:14px;padding:0 14px;border:2px solid transparent}
.field .inp:focus-within{border-color:var(--acc)}
.field input{flex:1;background:none;border:0;color:var(--txt);padding:14px 0;font-size:18px;font-weight:600;outline:none;width:100%}
.field .u{color:var(--mut);font-weight:600}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:6px}
.intro{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 60px);text-align:center}
.intro .logo{font-size:64px;font-weight:800;line-height:.9;margin-bottom:14px}
.intro .logo span{color:var(--acc);display:block}
.load{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.ring{width:150px;height:150px}
.res-big{font-family:"Barlow Condensed";font-size:44px;font-weight:800;line-height:1;color:var(--acc)}
/* workout overlay */
#wo{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:50;overflow:auto;display:none}
#wo.on{display:block}
#wo .wi{max-width:520px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 24px);min-height:100vh;display:flex;flex-direction:column}
.wtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wtime{font-family:"Barlow Condensed";font-size:22px;font-weight:700}
.exname{font-size:36px;font-weight:800;line-height:1.02;margin:6px 0}
.bigreps{font-family:"Barlow Condensed";font-size:64px;font-weight:800;line-height:1;color:var(--acc)}
.dots{display:flex;gap:6px;margin:14px 0}
.dots i{flex:1;height:8px;border-radius:9px;background:var(--card2)}
.dots i.d{background:var(--ok)}
.dots i.c{background:var(--acc)}
.how{background:var(--card);border-radius:16px;padding:14px;color:#cfd4db;font-size:14px}
.restbox{text-align:center;padding:30px 0 10px}
.restnum{font-family:"Barlow Condensed";font-size:110px;font-weight:800;line-height:1}
.restbtns{display:flex;gap:10px;justify-content:center;margin:18px 0}
.animbox{background:linear-gradient(180deg,#151a21,#0f1318);border-radius:20px;position:relative;margin:6px 0 10px}
.animbox svg.anim{display:block;width:100%;height:auto;max-height:240px}
.animbox .mm{position:absolute;top:10px;right:12px;opacity:.9}
.animbox .tag{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;background:rgba(255,91,31,.15);color:var(--acc);padding:3px 8px;border-radius:99px}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:14px;background:#1f1214;color:#ff6b6b;font-weight:700;text-decoration:none;font-size:14px;margin-top:10px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav b{font-family:"Barlow Condensed";font-size:22px}
.logrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.logrow .t{flex:1;min-width:0}.logrow .t b{display:block;font-size:14px;font-weight:600}.logrow .t small{color:var(--mut);font-size:12px}
.logrow .kc{font-family:"Barlow Condensed";font-weight:700;font-size:18px}
.del{width:28px;height:28px;border-radius:9px;background:var(--card2);color:var(--mut);font-size:12px;flex:none}
.meal .chk{font-size:18px;color:var(--acc)}
.qtyrow{display:flex;gap:8px;margin:14px 0 10px;align-items:stretch}
.qtyrow .inp{width:90px;background:var(--card);border-radius:12px;display:flex;align-items:center;padding:0 12px}
.qtyrow input,.gin input{width:100%;background:none;border:0;color:var(--txt);font-size:18px;font-weight:700;outline:none;padding:10px 0}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;flex:1}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
.seg.wide{width:100%}
.fitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-top:1px solid var(--line)}
.fitem .t{flex:1}.fitem b{display:block;font-size:14px;font-weight:600}.fitem small{color:var(--mut);font-size:12px}
.tot{display:flex;align-items:baseline;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0 14px;flex-wrap:wrap}
.tot b{font-family:"Barlow Condensed";font-size:24px;color:var(--acc)}
.gin{display:flex;align-items:center;gap:4px;width:74px;background:var(--card);border-radius:10px;padding:0 8px;font-size:12px;color:var(--mut)}
.gin input{font-size:15px;padding:7px 0}
#sh textarea,#sh .txt{width:100%;background:var(--card);border:2px solid transparent;border-radius:14px;color:var(--txt);padding:12px;font:inherit;outline:none;resize:vertical}
#sh textarea:focus,#sh .txt:focus{border-color:var(--acc)}
.photo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;border:2px dashed var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;text-align:center}
.photo input{display:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--card2);border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.newacts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.newacts .btn{width:100%;cursor:pointer}
.aibox{background:rgba(255,178,31,.1);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.nfgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.nf{min-width:0}.nf .seg{width:100%}
.nf label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.nf .inp{display:flex;align-items:center;background:var(--card);border-radius:12px;padding:0 10px;gap:4px;font-size:12px;color:var(--mut)}
.nf input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font-size:16px;font-weight:600;outline:none;padding:10px 0}
.bcrow{display:flex;gap:8px}.newacts .bcrow .btn{width:auto;flex:none}.bcrow input{flex:1;min-width:0;background:var(--card);border:2px solid transparent;border-radius:12px;color:var(--txt);padding:10px 12px;font:inherit;outline:none}.bcrow input:focus{border-color:var(--acc)}
.timer{position:relative;width:128px;height:128px;flex:none}
.timer svg{width:100%;height:100%}
.timer .tnum{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .tnum b{font-family:"Barlow Condensed";font-size:38px;font-weight:800;line-height:1}
.timer .tnum small{color:var(--mut);font-size:11px}
.timer.on .tnum b{color:var(--acc)}
#vamos{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);font-family:"Barlow Condensed";font-weight:800;font-size:44px;color:#fff;background:var(--acc);padding:4px 14px;border-radius:14px;opacity:0;pointer-events:none;white-space:nowrap}
#vamos.go{animation:vam 1.6s ease-out}

.vsel{width:100%;background:var(--card);color:var(--txt);border:0;border-radius:12px;padding:12px;font:inherit}
.cliprow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.cliprow .t{flex:1;min-width:0}.cliprow b{display:block;font-size:13px}.cliprow small{color:var(--mut);font-size:12px}.cliprow .del{display:grid;place-items:center}
.slowbtn{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mut)}
.slowbtn.on{background:var(--acc2);color:#140800}
.guidebtn{width:100%;margin-top:10px}
.linkbtn{color:var(--acc);font-weight:700;font-size:13px;padding:0 0 0 4px}
.guide{background:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;color:#d5dae1}
.guide h4{margin:12px 0 4px;font-size:14px;color:var(--txt)}
.guide h4:first-child{margin-top:0}
.guide p{margin:0}
.guide ol,.guide ul{margin:0;padding-left:20px}
.guide li{margin:3px 0}
.tcap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-weight:800;font-size:14px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}.tcap.ecc{background:rgba(47,210,122,.18);color:#5ff0a0}.tcap.con{background:rgba(255,91,31,.2);color:#ff8a5c}
.music{font-size:16px!important;text-decoration:none;color:#1ed760!important;background:#0f2416!important}
.bpair{display:flex;justify-content:center;gap:18px;margin-top:10px}
.bpair>div{text-align:center}.bpair small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.bmap{width:112px;height:auto;display:block}
.blegend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11px;color:var(--mut);margin-top:8px}

.recrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.recrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.recrow b{width:125px;font-weight:600;flex:none}

.spdays{display:flex;gap:6px}.spdays button{flex:1;height:40px;border-radius:12px;background:var(--card2);font-weight:700}.spdays button.on{background:#5b8def;color:#fff}
.wd.spin i{box-shadow:inset 0 0 0 2px #5b8def}
.spinhero{background:linear-gradient(135deg,#2f4fd1 0%,#5b8def 60%,#7fb2ff 100%);color:#fff}
.spinhero .btn.dark{background:#0d1640}
.actbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px}
.actbtn b{font-size:14px}
.sportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sportgrid button{background:var(--card);border-radius:12px;padding:9px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.sportgrid button span{font-size:22px}
.sportgrid button.on{border-color:var(--acc);background:rgba(255,91,31,.1)}
.stepbar{display:block;height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:6px 0 4px}.stepbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:9px}
.stepchart{display:flex;gap:6px;margin:12px 0 8px}
.stepchart .bw{position:relative;display:flex;align-items:flex-end;justify-content:center;height:90px;width:100%}
.stepchart .gl{position:absolute;left:-3px;right:-3px;border-top:1.5px dashed var(--ok);opacity:.55}
.stepchart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.stepchart i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;min-height:2px}
.stepchart small{font-size:11px;color:var(--mut)}.stepchart .v{font-size:10px;color:var(--mut)}
.posbadge{position:absolute;right:10px;top:10px;font-weight:800;font-size:13px;padding:5px 10px;border-radius:99px;transition:all .2s}
.posbadge.up{background:#ffb21f;color:#140800;transform:scale(1.08)}
.posbadge.down{background:rgba(255,255,255,.08);color:var(--mut)}
.sharegrid{display:flex;gap:8px;flex-wrap:wrap}.sharegrid .btn{flex:1;text-decoration:none}
.wa{background:#25d366!important;color:#06210f!important}
.vis{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;padding:12px 16px;margin:8px 0}
/* sheet */
#sh{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none}
#sh.on{display:block}
#sh .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6)}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#12161b;border-radius:24px 24px 0 0;padding:20px 18px calc(var(--sb) + 20px);max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;margin-bottom:10px}
.search input{flex:1;background:none;border:0;color:var(--txt);padding:13px 0;outline:none}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600}
.pill.on{background:var(--acc);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:14px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--card2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:21px}
.macro{margin-bottom:10px}
.macro .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.macro .b{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.macro .b i{display:block;height:100%;border-radius:9px}
.meal{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.meal .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.meal .h .t{flex:1}
.meal .h small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.meal .h b{display:block;font-size:16px}
.meal ul{margin:0;padding-left:18px;color:#cfd4db;font-size:14px}
.meal .mm{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.glasses button{width:34px;height:40px;border-radius:9px;background:var(--card2);font-size:18px;display:grid;place-items:center}
.glasses button.on{background:#1f6fff}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .ic{width:38px;height:38px;border-radius:12px;background:rgba(47,210,122,.12);display:grid;place-items:center}
.hist .t{flex:1}
.hist small{color:var(--mut)}
.addw{display:flex;gap:8px;margin-top:12px}
.addw .inp{flex:1;display:flex;align-items:center;background:var(--card2);border-radius:12px;padding:0 12px}
.addw input{flex:1;background:none;border:0;color:var(--txt);padding:10px 0;outline:none;font-weight:600;width:100%}
.confirm p{margin:6px 0 16px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 90px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s}
.empty{text-align:center;color:var(--mut);padding:20px 10px;font-size:14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--mut)}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.tv #app{max-width:940px}
.tv nav.tabs .in{max-width:940px}
.tv nav.tabs button{font-size:13px;min-width:90px}
.tv #wo .wi{max-width:1100px;padding-top:10px;padding-bottom:10px}
.tv #wo .wtop{margin-bottom:6px}
.tv .tvcols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.tv .tvL .animbox{margin:0}
.tv .tvL svg.anim{max-height:none;height:330px;width:100%}
.tv .tvR{display:flex;flex-direction:column;min-height:330px}
.tv .tvR > div:last-child{margin-top:auto;padding-top:8px!important}
.tv .tvR .exname{font-size:30px!important;margin:0 0 4px}
.tv .tvR .how{font-size:13px;padding:10px 12px}
.tv .tvR .btn{padding:10px 14px;font-size:17px}
.tv .tvR .bigreps{font-size:54px}
.tv .tvR .dots{margin:8px 0}
.tv .timer{width:140px;height:140px}
.tv .timer .tnum b{font-size:42px}
.tv .restnum{font-size:150px}
.tv .tvhide{display:none!important}
.tv :focus{outline:4px solid #ffb21f!important;outline-offset:3px;box-shadow:0 0 0 8px rgba(255,178,31,.25)}
.tv .opt:focus,.tv .dayitem:focus,.tv .fitem:focus,.tv .exrow:focus{transform:scale(1.02)}
.tv .hero h2{font-size:40px}
.tv #sh .pn{max-width:640px}
.tv button,.tv [tabindex],.tv a{scroll-margin-bottom:120px;scroll-margin-top:20px}
#tvkey{display:none!important;position:fixed;left:10px;bottom:10px;z-index:9999;background:rgba(0,0,0,.75);color:#ffb21f;font:12px sans-serif;padding:4px 8px;border-radius:8px;opacity:0;transition:opacity .4s;pointer-events:none}
.tv .tvfocus{outline:4px solid #ffb21f!important;outline-offset:3px;box-shadow:0 0 0 8px rgba(255,178,31,.3)!important}
.tv .tvnum{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:10px 16px;margin-top:2px}
.tv .tvnum b{flex:1;text-align:center;font-family:'Barlow Condensed';font-size:30px;font-weight:800}
.tv .tvnum small{color:var(--mut);font-weight:600}
.tv .tvnum .ar{font-size:20px;color:var(--mut);padding:0 6px}
.tv .tvnum.tvfocus .ar,.tv .tvnum:focus .ar{color:#ffb21f}
.tv .tvnum.editing{outline:4px solid #2fd27a!important;box-shadow:0 0 0 8px rgba(47,210,122,.25)!important}
.tv .tvnum .dg{display:inline-block;min-width:.62em;padding:0 2px;border-radius:6px}
.tv .tvnum .dg.cur{background:#2fd27a;color:#06210f}
.tv .tvnum .dg.sep{min-width:auto}
.tv .tvhint{font-size:13px;color:#2fd27a;margin:6px 4px 0;text-align:center}
.tv .bmap{width:150px}
</style>
